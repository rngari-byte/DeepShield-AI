<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 280px;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        padding: 14px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      p {
        font-size: 12px;
        color: #444;
        line-height: 1.4;
        margin: 4px 0 10px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 0;
        border-top: 1px solid #eee;
      }
      .row-label {
        font-size: 12px;
        font-weight: 600;
      }
      .row-sub {
        font-size: 11px;
        color: #777;
      }
      .switch {
        position: relative;
        display: inline-block;
        width: 36px;
        height: 20px;
        flex-shrink: 0;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: #ccc;
        border-radius: 20px;
        transition: 0.15s;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 14px;
        width: 14px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        border-radius: 50%;
        transition: 0.15s;
      }
      input:checked + .slider {
        background-color: #2d7dd2;
      }
      input:checked + .slider:before {
        transform: translateX(16px);
      }
      label.settings-label {
        font-size: 11px;
        font-weight: 600;
        display: block;
        margin-top: 10px;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
        font-size: 12px;
        margin-top: 4px;
      }
      button {
        margin-top: 8px;
        width: 100%;
        padding: 6px;
        font-size: 12px;
        cursor: pointer;
      }
      #status {
        font-size: 11px;
        margin-top: 6px;
        color: green;
        min-height: 14px;
      }
      details summary {
        font-size: 11px;
        color: #777;
        cursor: pointer;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h1>AI Image Checker</h1>
    <p>Right-click any image, anywhere, and choose "Check if AI-generated."</p>
    <div class="row">
      <div>
        <div class="row-label">Show badges on this site</div>
        <div class="row-sub" id="hostname-label">this site</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="badge-toggle" />
        <span class="slider"></span>
      </label>
    </div>
    <details>
      <summary>Advanced settings</summary>
      <label class="settings-label" for="backendUrl">Backend server URL</label>
      <input id="backendUrl" type="text" placeholder="https://your-backend/detect" />
      <button id="save">Save</button>
      <div id="status"></div>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
